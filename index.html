<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="绘野工作台">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="description" content="小赵和小董的视觉新居 - 内容创作工作台">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="./assets/icon-192.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>绘野工作台</title>
</head>
<body>
  <div id="app">

    <!-- 顶部标题栏 -->
    <header class="app-header">
      <div>
        <div class="header-title" id="headerTitle">📋 今日任务</div>
        <div class="header-date" id="headerDate"></div>
      </div>
      <button class="header-action" onclick="showToast('绘野工作台 v1.0\n小赵和小董的视觉新居')">
        <span style="font-size:18px;">🏠</span>
      </button>
    </header>

    <!-- 主内容区 -->
    <main class="app-main">

      <!-- ============ 任务页 ============ -->
      <section class="page active" id="page-tasks">
        <!-- 统计卡片 -->
        <div class="tasks-summary">
          <div class="summary-card">
            <div class="num" id="taskTotal">0</div>
            <div class="label">今日总数</div>
          </div>
          <div class="summary-card">
            <div class="num done" id="taskDone">0</div>
            <div class="label">已完成</div>
          </div>
          <div class="summary-card">
            <div class="num pending" id="taskPending">0</div>
            <div class="label">待完成</div>
          </div>
        </div>

        <!-- 进度条 -->
        <div class="card" style="margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:13px;color:var(--text-secondary);">今日完成度</span>
            <span style="font-size:13px;font-weight:600;color:var(--primary-light);" id="taskProgressText">0%</span>
          </div>
          <div class="progress-bar">
            <div class="fill" id="taskProgress" style="width:0%;"></div>
          </div>
        </div>

        <!-- 筛选 -->
        <div class="hot-filter" style="margin-bottom:12px;">
          <button class="filter-chip task-filter-chip active" data-filter="all">全部</button>
          <button class="filter-chip task-filter-chip" data-filter="pending">待办</button>
          <button class="filter-chip task-filter-chip" data-filter="done">已完成</button>
          <button class="filter-chip task-filter-chip" data-filter="shoot">📷 拍摄</button>
          <button class="filter-chip task-filter-chip" data-filter="edit">✂️ 剪辑</button>
          <button class="filter-chip task-filter-chip" data-filter="publish">📤 发布</button>
          <button class="filter-chip task-filter-chip" data-filter="operate">📊 运营</button>
        </div>

        <!-- 任务列表 -->
        <div id="taskList"></div>

        <!-- 添加按钮 -->
        <button class="btn btn-primary btn-block" id="addTaskBtn" style="margin-top:12px;">
          ➕ 添加新任务
        </button>
      </section>

      <!-- ============ 热点页 ============ -->
      <section class="page" id="page-hotspot">
        <!-- 搜索栏 -->
        <div class="search-bar">
          <input type="text" class="input" id="hotSearchInput" placeholder="搜索热点视频标题/作者...">
          <button class="btn btn-primary" id="hotSearchBtn">🔍</button>
          <button class="btn btn-outline" id="hotRefreshBtn">🔄</button>
        </div>

        <!-- 关键词筛选 -->
        <div class="hot-filter" id="hotKeywords"></div>

        <!-- 提示 -->
        <div class="card" style="padding:10px 14px;margin-bottom:12px;background:rgba(108,92,231,0.08);border-color:var(--border-active);">
          <div style="font-size:12px;color:var(--text-secondary);line-height:1.6;">
            💡 <strong>使用提示</strong>：点击「二创建议」查看如何改编这条热点视频为你的内容。收藏后可在灵感库查看。
          </div>
        </div>

        <!-- 视频列表 -->
        <div id="videoList"></div>
      </section>

      <!-- ============ 复盘页 ============ -->
      <section class="page" id="page-review">
        <div class="card" style="padding:10px 14px;margin-bottom:12px;background:rgba(0,184,148,0.08);border-color:rgba(0,184,148,0.3);">
          <div style="font-size:12px;color:var(--text-secondary);line-height:1.6;">
            📊 <strong>复盘说明</strong>：每次发布后记录数据和评分，系统自动生成优化建议。坚持复盘是内容提升的关键。
          </div>
        </div>

        <!-- 复盘列表 -->
        <div id="reviewList"></div>

        <!-- 添加按钮 -->
        <button class="btn btn-primary btn-block" id="addReviewBtn" style="margin-top:12px;">
          ➕ 新建复盘
        </button>
      </section>

      <!-- ============ 灵感页 ============ -->
      <section class="page" id="page-inspiration">
        <!-- 每日推荐 -->
        <div style="margin-bottom:8px;">
          <h3 style="font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;">
            🌟 今日灵感推荐
          </h3>
          <p style="font-size:12px;color:var(--text-muted);margin-top:2px;">每日为你精选3条创作灵感</p>
        </div>
        <div id="dailyInspiration"></div>

        <!-- 灵感库 -->
        <div style="margin:20px 0 8px;display:flex;align-items:center;justify-content:space-between;">
          <h3 style="font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;">
            📚 灵感库
          </h3>
          <button class="btn btn-sm btn-outline" id="addInspirationBtn">➕ 添加</button>
        </div>

        <!-- 分类筛选 -->
        <div class="hot-filter">
          <button class="filter-chip insp-filter-chip active" data-cat="all">全部</button>
          <button class="filter-chip insp-filter-chip" data-cat="选题方向">🎯 选题</button>
          <button class="filter-chip insp-filter-chip" data-cat="拍摄手法">📷 拍摄</button>
          <button class="filter-chip insp-filter-chip" data-cat="转场技巧">✨ 转场</button>
          <button class="filter-chip insp-filter-chip" data-cat="视觉设计">🎨 视觉</button>
          <button class="filter-chip insp-filter-chip" data-cat="文案技巧">✍️ 文案</button>
          <button class="filter-chip insp-filter-chip" data-cat="运营策略">📊 运营</button>
          <button class="filter-chip insp-filter-chip" data-cat="二创灵感">💡 二创</button>
          <button class="filter-chip insp-filter-chip" data-cat="自定义">📝 自定义</button>
        </div>

        <div id="inspirationLibrary"></div>
      </section>

    </main>

    <!-- 底部导航 -->
    <nav class="app-nav">
      <button class="nav-item active" data-page="tasks">
        <span class="nav-icon">📋</span>
        <span class="nav-label">任务</span>
      </button>
      <button class="nav-item" data-page="hotspot">
        <span class="nav-icon">🔥</span>
        <span class="nav-label">热点</span>
      </button>
      <button class="nav-item" data-page="review">
        <span class="nav-icon">📊</span>
        <span class="nav-label">复盘</span>
      </button>
      <button class="nav-item" data-page="inspiration">
        <span class="nav-icon">💡</span>
        <span class="nav-label">灵感</span>
      </button>
    </nav>

  </div>

  <!-- ============ 任务弹窗 ============ -->
  <div class="modal-overlay" id="taskModalOverlay">
    <div class="modal" id="taskModal">
      <div class="modal-handle"></div>
      <h2 class="modal-title" id="taskModalTitle">新建任务</h2>
      <form id="taskForm" onsubmit="return false;">
        <input type="hidden" id="taskId">
        <input type="hidden" id="taskDate">
        <div class="form-group">
          <label>任务标题 *</label>
          <input type="text" class="input" id="taskTitle" placeholder="如：拍摄收房开箱视频" maxlength="50">
        </div>
        <div class="form-group">
          <label>备注</label>
          <textarea class="textarea" id="taskNote" placeholder="补充说明..." maxlength="200"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>分类</label>
            <select class="select" id="taskCategory">
              <option value="shoot">📷 拍摄</option>
              <option value="edit">✂️ 剪辑</option>
              <option value="publish">📤 发布</option>
              <option value="operate">📊 运营</option>
              <option value="study">📚 学习</option>
            </select>
          </div>
          <div class="form-group">
            <label>优先级</label>
            <select class="select" id="taskPriority">
              <option value="high">高</option>
              <option value="mid" selected>中</option>
              <option value="low">低</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>计划时间</label>
          <input type="time" class="input" id="taskTime">
        </div>
        <div style="display:flex;gap:12px;margin-top:20px;">
          <button type="button" class="btn btn-outline btn-block" id="taskModalClose">取消</button>
          <button type="button" class="btn btn-primary btn-block" id="taskSaveBtn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ 复盘弹窗 ============ -->
  <div class="modal-overlay" id="reviewModalOverlay">
    <div class="modal" id="reviewModal">
      <div class="modal-handle"></div>
      <h2 class="modal-title" id="reviewModalTitle">新建复盘</h2>
      <form id="reviewForm" onsubmit="return false;">
        <input type="hidden" id="reviewId">
        <div class="form-group">
          <label>视频标题 *</label>
          <input type="text" class="input" id="videoTitle" placeholder="如：收房第一天验房全记录" maxlength="50">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>发布平台</label>
            <select class="select" id="reviewPlatform">
              <option value="douyin">🎵 抖音</option>
              <option value="xiaohongshu">📕 小红书</option>
              <option value="other">📱 其他</option>
            </select>
          </div>
        </div>

        <!-- 数据录入 -->
        <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin:16px 0 8px;">
          📈 互动数据
        </div>

        <!-- 截图上传 -->
        <div class="upload-area" id="screenshotUpload" style="margin-bottom:12px;">
          <div class="upload-icon">📸</div>
          <div class="upload-text">上传抖音主页截图<br>自动识别互动数据</div>
          <input type="file" id="screenshotInput" accept="image/*" style="display:none;">
        </div>

        <div class="form-row" style="grid-template-columns:repeat(2,1fr);display:grid;gap:12px;">
          <div class="form-group">
            <label>播放量</label>
            <input type="number" class="input" id="dataViews" placeholder="0" min="0">
          </div>
          <div class="form-group">
            <label>点赞数</label>
            <input type="number" class="input" id="dataLikes" placeholder="0" min="0">
          </div>
          <div class="form-group">
            <label>评论数</label>
            <input type="number" class="input" id="dataComments" placeholder="0" min="0">
          </div>
          <div class="form-group">
            <label>转发数</label>
            <input type="number" class="input" id="dataShares" placeholder="0" min="0">
          </div>
        </div>

        <!-- 评分 -->
        <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin:16px 0 8px;">
          ⭐ 内容评分（1-5星）
        </div>
        <div class="score-grid" id="reviewScores"></div>

        <!-- 备注 -->
        <div class="form-group">
          <label>复盘笔记</label>
          <textarea class="textarea" id="reviewNote" placeholder="记录这次内容的亮点和不足..." maxlength="300"></textarea>
        </div>

        <div style="display:flex;gap:12px;margin-top:20px;">
          <button type="button" class="btn btn-outline btn-block" id="reviewModalClose">取消</button>
          <button type="button" class="btn btn-primary btn-block" id="reviewSaveBtn">保存复盘</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 脚本 -->
  <script src="./modules/store.js"></script>
  <script src="./modules/tasks.js"></script>
  <script src="./modules/hotspot.js"></script>
  <script src="./modules/review.js"></script>
  <script src="./modules/inspiration.js"></script>
  <script src="./app.js"></script>
</body>
</html>
