<style>
/* =========================================================
   绘野的工作台 · 设计系统 (Designer OS)
   主色：墨绿 / 风格：极简 · 干净 · 轻量 · 设计师工作台
   ========================================================= */
:root{
  --green-900:#14342b;
  --green-800:#1b4332;
  --green-700:#2d6a4f;
  --green-600:#40916c;
  --green-500:#52b788;
  --green-300:#95d5b2;
  --green-100:#d8f3dc;
  --green-050:#eef7f1;

  --bg:#f5f8f6;
  --surface:#ffffff;
  --surface-2:#fbfdfc;
  --text:#16241e;
  --text-2:#5d6f67;
  --text-3:#8a9a92;
  --border:#e6ece9;
  --border-2:#eef3f0;

  --danger:#e5484d;
  --danger-bg:#fdecec;
  --warn:#e8920c;
  --warn-bg:#fdf3e3;
  --blue:#2f6fed;
  --blue-bg:#eaf1fe;
  --purple:#7c5cff;
  --purple-bg:#efeafe;

  --radius:14px;
  --radius-sm:10px;
  --radius-xs:8px;
  --shadow-sm:0 1px 2px rgba(20,52,43,.05);
  --shadow:0 1px 3px rgba(20,52,43,.06), 0 8px 24px rgba(20,52,43,.07);
  --shadow-lg:0 12px 40px rgba(20,52,43,.16);
  --sidebar-w:236px;
  --font:'PingFang SC','Microsoft YaHei','Segoe UI',-apple-system,system-ui,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--green-100);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;text-decoration:none;}

/* ---------- Layout ---------- */
.app{display:flex;height:100vh;overflow:hidden;}

.sidebar{
  width:var(--sidebar-w);
  flex:0 0 var(--sidebar-w);
  background:linear-gradient(180deg,var(--green-800),var(--green-900));
  color:#dff3e8;
  display:flex;
  flex-direction:column;
  padding:18px 14px;
  position:relative;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;}
.brand-mark{
  width:38px;height:38px;border-radius:11px;
  background:var(--green-500);
  display:grid;place-items:center;font-size:20px;
  box-shadow:0 4px 14px rgba(82,183,136,.45);
}
.brand-text{display:flex;flex-direction:column;line-height:1.2;}
.brand-text strong{font-size:15px;color:#fff;letter-spacing:.3px;}
.brand-text span{font-size:11px;color:#8fc7a8;letter-spacing:1px;text-transform:uppercase;}

.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;padding-top:4px;}
.nav::-webkit-scrollbar{width:0;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:10px;
  color:#bfe0d0;font-size:13.5px;font-weight:500;
  border:1px solid transparent;
  transition:background .15s,color .15s,transform .1s;
  position:relative;
}
.nav-item .ico{font-size:16px;width:20px;text-align:center;filter:saturate(1.1);}
.nav-item .badge{
  margin-left:auto;background:var(--green-600);color:#fff;
  font-size:11px;padding:1px 7px;border-radius:20px;font-weight:600;
}
.nav-item:hover{background:rgba(149,213,178,.10);color:#fff;}
.nav-item.active{
  background:rgba(149,213,178,.16);color:#fff;
  border-color:rgba(149,213,178,.28);
}
.nav-item.active::before{
  content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:4px;height:20px;border-radius:0 4px 4px 0;background:var(--green-300);
}
.nav-sep{height:1px;background:rgba(149,213,178,.12);margin:10px 8px;}

.sidebar-foot{margin-top:auto;padding-top:12px;}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;background:rgba(255,255,255,.05);}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--green-500);display:grid;place-items:center;color:#06251a;font-weight:700;}
.user-meta{display:flex;flex-direction:column;line-height:1.25;}
.user-meta strong{font-size:12.5px;color:#fff;}
.user-meta span{font-size:11px;color:#8fc7a8;}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{
  height:64px;flex:0 0 64px;background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 26px;
}
.topbar .title{display:flex;flex-direction:column;}
.topbar .title h1{font-size:17px;font-weight:700;letter-spacing:.2px;}
.topbar .title span{font-size:12px;color:var(--text-3);}
.topbar .spacer{flex:1;}
.topbar .global-search{
  display:flex;align-items:center;gap:8px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;width:280px;color:var(--text-3);
}
.topbar .global-search input{border:0;background:transparent;outline:none;flex:1;color:var(--text);}

.content{flex:1;overflow-y:auto;padding:26px;scroll-behavior:smooth;}
.content::-webkit-scrollbar{width:9px;}
.content::-webkit-scrollbar-thumb{background:#d6e0db;border-radius:9px;border:2px solid var(--bg);}

/* ---------- Page header ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.page-head h2{font-size:20px;font-weight:700;}
.page-head p{font-size:12.5px;color:var(--text-3);margin-top:3px;}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* ---------- Stat cards ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
}
.stat-card .label{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:7px;}
.stat-card .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--green-050);color:var(--green-700);}
.stat-card .value{font-size:27px;font-weight:750;margin-top:12px;letter-spacing:.3px;line-height:1.1;}
.stat-card .value small{font-size:14px;font-weight:600;color:var(--text-3);margin-left:2px;}
.stat-card .sub{font-size:12px;color:var(--text-3);margin-top:6px;}
.stat-card.accent{background:linear-gradient(135deg,var(--green-700),var(--green-800));border-color:transparent;color:#eafff2;}
.stat-card.accent .label{color:#a9d8c1;}
.stat-card.accent .ico{background:rgba(255,255,255,.16);color:#fff;}
.stat-card.accent .sub{color:#bfe6d3;}
.stat-card.warn .value{color:var(--danger);}

/* ---------- Cards / panels ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border-2);}
.card-head h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card-head .sub{font-size:12px;color:var(--text-3);}
.card-body{padding:18px;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.split{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  border:1px solid transparent;border-radius:10px;padding:8px 14px;
  font-size:13px;font-weight:600;transition:all .14s;white-space:nowrap;
  background:var(--bg);color:var(--text-2);
}
.btn:hover{filter:brightness(.98);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--green-700);color:#fff;box-shadow:0 4px 12px rgba(45,106,79,.28);}
.btn-primary:hover{background:var(--green-800);}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text-2);}
.btn-ghost:hover{background:var(--bg);}
.btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--danger-bg);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px;}
.btn-icon{padding:6px 9px;}
.btn-block{width:100%;}

/* ---------- Tags ---------- */
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;
  line-height:1.5;border:1px solid transparent;
}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8;}
.tag.todo{background:var(--border-2);color:var(--text-2);}
.tag.doing{background:var(--blue-bg);color:var(--blue);}
.tag.done{background:var(--green-100);color:var(--green-700);}
.tag.overdue{background:var(--danger-bg);color:var(--danger);}
.tag.fix{background:var(--warn-bg);color:var(--warn);}
.tag.normal{background:var(--green-100);color:var(--green-700);}
.tag.over{background:var(--danger-bg);color:var(--danger);}
.tag.balance{background:var(--blue-bg);color:var(--blue);}
.tag.reached{background:var(--blue-bg);color:var(--blue);}
.tag.expired{background:#eef1f0;color:var(--text-3);}
.tag.cat{background:var(--green-050);color:var(--green-700);border-color:var(--green-100);}
.tag.cat::before{display:none;}
.tag.green{background:var(--green-100);color:var(--green-700);}

.cat-dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px;vertical-align:middle;}

/* ---------- Progress ---------- */
.progress{height:8px;background:var(--border-2);border-radius:20px;overflow:hidden;width:100%;}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--green-500),var(--green-700));border-radius:20px;transition:width .5s;}
.progress.thin{height:6px;}
.progress-row{display:flex;align-items:center;gap:10px;}
.progress-row .pct{font-size:12px;font-weight:700;color:var(--green-700);min-width:38px;text-align:right;}

/* ---------- Countdown ---------- */
.countdown{display:flex;gap:8px;}
.cd-box{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 10px;text-align:center;min-width:46px;}
.cd-box b{font-size:20px;display:block;color:#fff;}
.cd-box span{font-size:10px;color:#bfe6d3;}

/* ---------- Tables / lists ---------- */
.list{display:flex;flex-direction:column;}
.row{
  display:flex;align-items:center;gap:14px;padding:13px 16px;
  border-bottom:1px solid var(--border-2);transition:background .12s;
}
.row:last-child{border-bottom:0;}
.row:hover{background:var(--surface-2);}
.row .main{flex:1;min-width:0;}
.row .title{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;}
.row .meta{font-size:12px;color:var(--text-3);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap;}
.row .ops{display:flex;gap:6px;flex-shrink:0;}
.link{color:var(--green-700);font-weight:600;background:none;border:0;font-size:12.5px;padding:4px 6px;border-radius:6px;}
.link:hover{background:var(--green-050);}
.link.danger{color:var(--danger);}
.link.danger:hover{background:var(--danger-bg);}

.empty{padding:40px;text-align:center;color:var(--text-3);font-size:13px;}
.empty .em{font-size:30px;display:block;margin-bottom:8px;}

/* ---------- Search / filter / fields ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.field{
  display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:8px 12px;
}
.field input,.field select{border:0;outline:none;background:transparent;color:var(--text);}
.search{flex:1;min-width:200px;}
.search input{flex:1;}

/* ---------- Calendar ---------- */
.calendar{user-select:none;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-head h4{font-size:14px;font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-grid .dow{font-size:11px;color:var(--text-3);text-align:center;padding:4px 0;}
.cal-cell{
  aspect-ratio:1;text-align:center;font-size:12.5px;border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;color:var(--text-2);background:var(--surface-2);border:1px solid transparent;
}
.cal-cell.muted{color:var(--text-3);opacity:.5;}
.cal-cell.today{border-color:var(--green-500);color:var(--green-800);font-weight:700;background:var(--green-050);}
.cal-cell.done::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--green-600);}
.cal-cell.over::after{background:var(--danger);}
.cal-cell .dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;}

/* ---------- Modal ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(20,52,43,.42);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:50;animation:fade .15s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:480px;max-width:94vw;background:var(--surface);border-radius:16px;
  box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s;max-height:90vh;display:flex;flex-direction:column;
}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal.sm{width:400px;}
.modal.lg{width:640px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-2);}
.modal-head h3{font-size:16px;font-weight:700;}
.modal-head .x{border:0;background:var(--bg);width:30px;height:30px;border-radius:8px;color:var(--text-2);font-size:16px;}
.modal-body{padding:20px;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border-2);display:flex;justify-content:flex-end;gap:10px;background:var(--surface-2);}

/* ---------- Form ---------- */
.form{display:flex;flex-direction:column;gap:14px;}
.form .grp{display:flex;flex-direction:column;gap:6px;}
.form label{font-size:12.5px;font-weight:600;color:var(--text-2);}
.form .req::after{content:" *";color:var(--danger);}
.form input[type=text],.form input[type=number],.form input[type=date],.form input[type=time],.form input[type=datetime-local],.form select,.form textarea{
  border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:var(--surface-2);color:var(--text);outline:none;transition:border .15s,box-shadow .15s;width:100%;
}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--green-500);box-shadow:0 0 0 3px var(--green-100);background:#fff;}
.form textarea{resize:vertical;min-height:74px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.switch{position:relative;display:inline-block;width:42px;height:24px;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:.2s;cursor:pointer;}
.switch .slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:var(--shadow-sm);}
.switch input:checked + .slider{background:var(--green-600);}
.switch input:checked + .slider::before{transform:translateX(18px);}
.toggle-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;}

/* ---------- Toast ---------- */
.toast-root{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:10px;z-index:80;}
.toast{
  background:var(--green-800);color:#eafff2;padding:11px 16px;border-radius:11px;
  box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;
  animation:slidein .25s;
}
.toast.warn{background:var(--warn);color:#fff;}
.toast.err{background:var(--danger);color:#fff;}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Charts ---------- */
.pie{width:160px;height:160px;border-radius:50%;position:relative;display:grid;place-items:center;}
.pie .hole{width:96px;height:96px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;}
.legend .li{display:flex;align-items:center;gap:8px;color:var(--text-2);}
.legend .sw{width:10px;height:10px;border-radius:3px;}
.linechart{width:100%;height:200px;}

/* ---------- Misc ---------- */
.muted{color:var(--text-3);}
.amount{font-variant-numeric:tabular-nums;font-weight:700;}
.amount.in{color:var(--green-700);}
.amount.out{color:var(--danger);}
.divider{height:1px;background:var(--border-2);margin:4px 0;}
.section-title{font-size:14px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title .bar{width:4px;height:15px;border-radius:3px;background:var(--green-600);}
.kpi-inline{display:flex;gap:18px;flex-wrap:wrap;}
.kpi-inline .k{font-size:12.5px;color:var(--text-3);}
.kpi-inline .k b{display:block;font-size:18px;color:var(--text);font-weight:750;margin-top:2px;}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;}
.photo-grid .ph{aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,var(--green-100),var(--green-300));display:grid;place-items:center;font-size:22px;color:var(--green-700);position:relative;overflow:hidden;}
.photo-grid .ph.add{border:1.5px dashed var(--green-300);background:var(--green-050);color:var(--green-600);cursor:pointer;}

/* ---------- 短视频复盘 ---------- */
.sv-meta{font-size:13px;color:var(--text-3);margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sv-stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.sv-stat{min-width:66px;background:var(--bg);border:1px solid var(--border-2);border-radius:10px;padding:8px 10px;text-align:center}
.sv-stat .v{font-size:16px;font-weight:750;color:var(--text)}
.sv-stat .l{font-size:11px;color:var(--text-3);margin-top:2px}
.sv-diag{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.sv-flag{font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:8px;border-left:3px solid}
.sv-bad{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.sv-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.sv-good{background:var(--green-050);color:var(--green-800);border-color:var(--green-500)}
.sv-best{background:var(--green-050);border:1px solid var(--green-100);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:13.5px;color:var(--text-2)}
.sv-best b{color:var(--green-800)}
.sv-note{font-size:13px;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:8px 10px;border:1px solid var(--border-2)}
.sv-card .card-head h3{font-size:14.5px}

.prev-img{max-width:100%;max-height:68vh;border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.28)}

<script>
/* =========================================================
   store.js — 全局状态 / 持久化 / 核心联动逻辑
   ========================================================= */
(function(){
  const App = (window.App = window.App || {});
  const KEY = "designer_os_state_v1";
  App.TODAY = "2026-07-31";
  App.BUILD = "2026-07-31.10";

  const clone = (o)=>JSON.parse(JSON.stringify(o));

  // ---------- load / save ----------
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){ const s = JSON.parse(raw); if(s && s.todayTasks){
        // schema 升级：本地老数据缺新字段时，用 seed 的默认值补齐，避免新版功能白屏
        const merged = Object.assign({}, clone(App.seed), s);
        App._noPersist=false; return merged;
      } }
      App._noPersist=false;
    }catch(e){ App._noPersist=true; }
    return clone(App.seed);
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(store.state)); App._noPersist=false; }
    catch(e){
      App._noPersist=true;
      if(App.ui && App.ui.toast) App.ui.toast("⚠️ 本地存储已满，本次修改可能未保存。请到「系统设置 → 数据」导出备份并删减素材图片",4200);
      else console.warn("save failed", e);
    }
    if(App.cloudSync && !App.cloudSync.suppress()) App.cloudSync.schedulePush();
  }
  App.STORAGE_KEY = KEY;
  App.dataUsage = function(){ try{ const v=localStorage.getItem(KEY)||""; const kb=new Blob([v]).size/1024; return (kb>1024?(kb/1024).toFixed(2)+" MB":Math.round(kb)+" KB")+" / 5 MB"; }catch(e){ return "未知"; } };

  // ---------- 云端自动同步（GitHub 仓库 API） ----------
  // 每次数据保存时同步推送到 GitHub 仓库；页面打开时自动拉取最新数据。
  // 使用 GitHub Contents API，数据以 JSON 文件形式存储在指定仓库中。
  App.cloudSync = (function(){
    let suppressFlag=false, lastContentHash=null, pushing=false, pushTimer=null, lastSha=null;

    function cfg(){
      const s=store.state.settings;
      return {
        on: !!s.cloudSync,
        token: s.githubToken || "",
        repo: s.ghRepo || "",
        branch: s.ghBranch || "main",
        path: s.ghPath || "workbench-data.json"
      };
    }
    function enabled(){ return cfg().on && cfg().token && cfg().repo; }
    function suppress(){ return suppressFlag; }

    function headers(c){
      const h = {"Accept":"application/vnd.github.v3+json"};
      if(c.token) h["Authorization"] = "token " + c.token;
      return h;
    }
    function apiUrl(c, withRef){
      let url = "https://api.github.com/repos/" + c.repo + "/contents/" + encodeURIComponent(c.path);
      if(withRef) url += "?ref=" + encodeURIComponent(c.branch);
      return url;
    }
    function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
    function b64decode(b64){ return decodeURIComponent(escape(atob(b64))); }
    function hash(str){ return btoa(unescape(encodeURIComponent(str))).slice(0,20); }

    // 推送数据到 GitHub 仓库
    async function pushOnce(){
      const c = cfg();
      if(!c.token || !c.repo){
        if(App.ui&&App.ui.toast) App.ui.toast("请先在设置中填写 GitHub Token 和仓库名","warn");
        return;
      }
      if(pushing) return;
      pushing=true;
      try{
        const content = JSON.stringify(store.state, (k,v)=> (k==="githubToken")?undefined:v, 2);
        // 先 GET 获取当前文件的 sha（文件不存在时跳过）
        let sha = null;
        try{
          const getRes = await fetch(apiUrl(c,true), {headers: headers(c)});
          if(getRes.ok){
            const fileData = await getRes.json();
            sha = fileData.sha || null;
          }
        }catch(e){ /* 文件可能不存在 */ }
        // PUT 推送
        const body = {
          message: "workbench sync " + new Date().toISOString().slice(0,19).replace("T"," "),
          content: b64encode(content),
          branch: c.branch
        };
        if(sha) body.sha = sha;
        const res = await fetch(apiUrl(c,false), {
          method: "PUT",
          headers: Object.assign(headers(c), {"Content-Type":"application/json"}),
          body: JSON.stringify(body)
        });
        if(!res.ok){
          const errBody = await res.json().catch(()=>({}));
          throw new Error("HTTP " + res.status + (errBody.message?": "+errBody.message:""));
        }
        lastContentHash = hash(content);
        lastSha = sha;
        if(App.ui&&App.ui.toast) App.ui.toast("☁ 已同步到 GitHub");
      }catch(err){
        let msg = err.message;
        if(msg.includes("401")){
          msg = "Token 认证失败。请检查：① Token 是否复制完整 ② 是否勾选了 repo 权限 ③ Token 是否过期";
        }else if(msg.includes("404")){
          msg = "仓库或文件路径不存在。请检查仓库名是否为 owner/repo 格式，且仓库已创建";
        }else if(msg.includes("403")){
          msg = "没有写入权限。请确认 Token 有 repo 权限，且对该仓库有写权限";
        }
        if(App.ui&&App.ui.toast) App.ui.toast("GitHub 同步失败："+msg,"warn",4200);
      }
      pushing=false;
    }
    function schedulePush(){
      if(!enabled() || suppress()) return;
      if(pushTimer) clearTimeout(pushTimer);
      pushTimer = setTimeout(()=>{ pushTimer=null; pushOnce(); }, 800);
    }
    // 从 GitHub 拉取数据
    async function pull(){
      const c = cfg();
      if(!c.token || !c.repo){
        if(App.ui&&App.ui.toast) App.ui.toast("请先在设置中填写 GitHub Token 和仓库名","warn");
        return false;
      }
      try{
        const res = await fetch(apiUrl(c,true), {headers: headers(c)});
        if(res.status===404){
          if(App.ui&&App.ui.toast) App.ui.toast("云端暂无数据，请先推送一次","warn");
          return false;
        }
        if(!res.ok) throw new Error("HTTP "+res.status);
        const data = await res.json();
        const content = b64decode(data.content.replace(/\n/g,""));
        const newHash = hash(content);
        if(newHash === lastContentHash) return true; // 无变化
        suppressFlag = true;
        // 保留本地 Token，不被云端数据覆盖
        const localToken = store.state.settings.githubToken;
        App.store.importData(content);
        if(localToken) store.state.settings.githubToken = localToken;
        lastContentHash = newHash;
        lastSha = data.sha || null;
        setTimeout(()=>{ suppressFlag=false; }, 2000);
        if(App.ui&&App.ui.toast) App.ui.toast("☁ 已从 GitHub 拉取最新数据");
        return true;
      }catch(e){
        let msg = e.message;
        if(msg.includes("401")) msg = "Token 认证失败，请检查 GitHub Token";
        else if(msg.includes("404")) msg = "云端暂无数据，请先在另一台设备推送一次";
        if(App.ui&&App.ui.toast) App.ui.toast("拉取失败："+msg,"warn",4000);
        return false;
      }
    }
    // 后台静默拉取：每30秒检查一次，有变化才更新，不弹提示
    async function backgroundPull(){
      if(!enabled()) return;
      const c = cfg();
      try{
        const res = await fetch(apiUrl(c,true), {headers: headers(c)});
        if(!res.ok) return;
        const data = await res.json();
        const content = b64decode(data.content.replace(/\n/g,""));
        const newHash = hash(content);
        if(newHash === lastContentHash) return; // 无变化
        suppressFlag = true;
        const localToken = store.state.settings.githubToken;
        App.store.importData(content);
        if(localToken) store.state.settings.githubToken = localToken;
        lastContentHash = newHash;
        lastSha = data.sha || null;
        setTimeout(()=>{ suppressFlag=false; }, 2000);
      }catch(e){}
    }
    return {enabled, suppress, schedulePush, pull, pushOnce, backgroundPull, cfg};
  })();

  const store = {
    state: load(),
    save,
    uid(p){ return (p||"id") + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3); },
    reset(){ App.store.state = clone(App.seed); save(); App.refresh && App.refresh(); },
    // 导出：返回完整 JSON 备份串（githubToken 不导出，避免泄露）
    exportData(){
      const s = JSON.parse(JSON.stringify(store.state));
      if(s.settings){ s.settings.githubToken = ""; }
      return JSON.stringify(s, null, 2);
    },
    // 导入：用备份 JSON 覆盖当前数据（换手机/电脑后恢复）。带 schema 校验与默认值补齐
    importData(str){
      const data = typeof str === "string" ? JSON.parse(str) : str;
      if(!data || typeof data !== "object" || !Array.isArray(data.todayTasks))
        throw new Error("不是有效的工作台备份文件");
      const merged = Object.assign({}, clone(App.seed), data);
      store.state = merged;
      save();
      App.refresh && App.refresh();
      return merged;
    },
  };
  App.store = store;

  // ---------- date helpers ----------
  function parseD(s){ const p=String(s).slice(0,10).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function ts(s){ return Math.floor(parseD(s).getTime()/86400000); }
  App.todayNum = ts(App.TODAY);
  App.daysLeft = function(dateStr){ return ts(dateStr) - App.todayNum; };
  App.fmtMoney = function(n){ return "¥" + Math.round(n).toLocaleString("zh-CN"); };

  // ---------- derived computations (全部自动计算) ----------
  App.calc = {
    todayStats(){
      const t = store.state.todayTasks;
      const total = t.length;
      const done = t.filter(x=>x.status==="已完成").length;
      const overdue = t.filter(x=>x.status==="逾期").length;
      const rate = total? Math.round(done/total*100):0;
      return {total,done,overdue,rate};
    },
    wedding(){
      const w = store.state.wedding;
      let total=0, done=0; const groups=[];
      for(const g of App.WEDDING_GROUPS){
        const arr = w.groups[g]||[];
        const c = arr.filter(x=>x.status==="已完成").length;
        total+=arr.length; done+=c;
        groups.push({name:g,count:arr.length,done:c,pct:arr.length?Math.round(c/arr.length*100):0});
      }
      const spent = w.budgetLedger.reduce((s,x)=>s+(+x.amount||0),0);
      const remaining = w.totalBudget - spent;
      const pct = total?Math.round(done/total*100):0;
      const budgetStatus = spent>w.totalBudget?"超支":(spent===w.totalBudget?"正常":"结余");
      const days = App.daysLeft(w.weddingDate);
      const pending = total-done;
      return {groups,total,done,pct,spent,remaining,budgetStatus,days,pending,totalBudget:w.totalBudget};
    },
    savingStatus(g){
      const saved = (g.records||[]).reduce((s,x)=>s+(+x.amount||0),0);
      const pct = g.target?Math.round(saved/g.target*100):100;
      let status="进行中";
      if(saved>=g.target) status="已达成";
      else if(App.daysLeft(g.deadline)<0) status="已过期";
      return {saved,pct,status,remaining:Math.max(g.target-saved,0)};
    },
    savingOverview(){
      const s = store.state.savings;
      const active = s.filter(g=>App.calc.savingStatus(g).status!=="已达成" && App.calc.savingStatus(g).status!=="已过期").length;
      const totalSaved = s.reduce((a,g)=>a+App.calc.savingStatus(g).saved,0);
      const totalTarget = s.reduce((a,g)=>a+g.target,0);
      const rate = totalTarget?Math.round(totalSaved/totalTarget*100):0;
      return {active,totalSaved,totalTarget,rate};
    },
    ledgerMonth(){
      const m = "2026-07";
      const tx = store.state.transactions.filter(x=>x.time.slice(0,7)===m);
      const income = tx.filter(x=>x.type==="income").reduce((s,x)=>s+x.amount,0);
      const expense = tx.filter(x=>x.type==="expense").reduce((s,x)=>s+x.amount,0);
      return {income,expense,balance:income-expense};
    },
    taskDisplayStatus(t){
      if(t.status==="已完成") return "已完成";
      if(ts(t.due) < App.todayNum) return "逾期";
      return t.status;
    },
    // 短视频复盘：聚合看板
    svOverview(){
      const arr=store.state.svreviews||[];
      const total=arr.length;
      const totalPlay=arr.reduce((s,x)=>s+x.play,0);
      const avgFinish=total?Math.round(arr.reduce((s,x)=>s+x.finish,0)/total):0;
      const eng=arr.reduce((s,x)=>s+(x.like+x.comment+x.fav+x.share),0);
      const avgEng=totalPlay?+(eng/totalPlay*100).toFixed(2):0;
      const byPlat={};
      arr.forEach(x=>{ byPlat[x.platform]=byPlat[x.platform]||{play:0,n:0}; byPlat[x.platform].play+=x.play; byPlat[x.platform].n++; });
      let bestPlat="-",bestAvg=-1;
      for(const p in byPlat){ const a=byPlat[p].play/byPlat[p].n; if(a>bestAvg){bestAvg=a;bestPlat=p;} }
      const top=arr.slice().sort((a,b)=>b.play-a.play)[0];
      return {total,totalPlay,avgFinish,avgEng,bestPlat,bestAvg:Math.round(bestAvg),top};
    },
    // 短视频复盘：单条健康度诊断（完播/点赞/评论/收藏/转发）
    svDiagnose(e){
      const out=[]; const r=(a,b)=>b?+(a/b*100).toFixed(2):0;
      if(e.finish<20) out.push({lv:"bad",t:"完播率仅 "+e.finish+"%：开头 3 秒没留住人。前 3 秒必须给强钩子（反差/悬念/利益点），别铺垫。"});
      else if(e.finish<35) out.push({lv:"warn",t:"完播率 "+e.finish+"% 一般：中段节奏偏慢，可压缩信息、加卡点。"});
      else out.push({lv:"good",t:"完播率 "+e.finish+"% 优秀，开头和节奏控制得不错。"});
      const lr=r(e.like,e.play);
      if(lr<3) out.push({lv:"bad",t:"点赞率 "+lr+"% 偏低：内容价值感/情绪共鸣不足，强化「有用 or 有情绪」其中之一。"});
      else if(lr<6) out.push({lv:"warn",t:"点赞率 "+lr+"% 正常，可加一句明确的「觉得有用点个赞」。"});
      else out.push({lv:"good",t:"点赞率 "+lr+"% 优秀，内容认可度高。"});
      const cr=r(e.comment,e.play);
      if(cr<0.3) out.push({lv:"bad",t:"评论率 "+cr+"% 偏低：缺互动钩子。结尾抛具体问题（「你踩过哪个坑？」）引导留言。"});
      else if(cr<1) out.push({lv:"warn",t:"评论率 "+cr+"% 一般，可在视频中埋 2 个讨论点。"});
      else out.push({lv:"good",t:"评论率 "+cr+"% 优秀，社区活跃度高。"});
      const fr=r(e.fav,e.play);
      if(fr<1) out.push({lv:"bad",t:"收藏率 "+fr+"% 偏低：缺实用干货。加清单/模板/步骤图，提升「先藏再说」。"});
      else if(fr<3) out.push({lv:"warn",t:"收藏率 "+fr+"% 正常，可强化「评论区领 checklist」。"});
      else out.push({lv:"good",t:"收藏率 "+fr+"% 优秀，实用性强。"});
      const sr=r(e.share,e.play);
      if(sr<0.5) out.push({lv:"bad",t:"转发率 "+sr+"% 偏低：缺共鸣/身份表达点。做「说出了我的心声」型内容更易被转。"});
      else if(sr<2) out.push({lv:"warn",t:"转发率 "+sr+"% 一般，结尾加「转发给需要的朋友」。"});
      else out.push({lv:"good",t:"转发率 "+sr+"% 优秀，自传播性强。"});
      return out;
    },
  };

    deleteArticle(id){ store.state.articles=store.state.articles.filter(x=>x.id!==id); save(); },
    publishArticle(id){ const a=store.state.articles.find(x=>x.id===id); if(a)a.status="已发布"; save(); },

    // ---- 热点 -> 创作助手 ----
    hotspotToTopic(id){
      const h=store.state.hotspots.find(x=>x.id===id); if(!h)return null;
      const t={id:store.uid("tp"),title:h.title,platform:"小红书",track:h.track,status:"未拍摄",script:"",note:"来自热点榜 #"+h.rank};
      store.state.topics.unshift(t); save(); return t;
    },

    // ---- 备婚管理 ----
    setWeddingBudget(total){ store.state.wedding.totalBudget=+total||0; save(); },
    setWeddingDate(dateStr){ if(dateStr) store.state.wedding.weddingDate=String(dateStr); save(); },
    addWeddingTask(group,v){
      store.state.wedding.groups[group]=store.state.wedding.groups[group]||[];
      store.state.wedding.groups[group].push({id:store.uid("w"),title:v.title,plan:v.plan,
        status:"待办",note:v.note||""}); save();
    },
    updateWeddingTask(id,v){
      for(const g of App.WEDDING_GROUPS){ const t=(store.state.wedding.groups[g]||[]).find(x=>x.id===id); if(t){Object.assign(t,v);break;} } save();
    },
    completeWeddingTask(id){ M._weddingSet(id, s=> s==="已完成"?"待办":"已完成"); },
    delayWeddingTask(id){
      for(const g of App.WEDDING_GROUPS){ const t=(store.state.wedding.groups[g]||[]).find(x=>x.id===id); if(t){ const d=parseD(t.plan); d.setDate(d.getDate()+7); t.plan=d.toISOString().slice(0,10); break; } } save();
    },
    _weddingSet(id,fn){
      for(const g of App.WEDDING_GROUPS){ const t=(store.state.wedding.groups[g]||[]).find(x=>x.id===id); if(t){t.status=fn(t.status);break;} } save();
    },
    deleteWeddingTask(id){ for(const g of App.WEDDING_GROUPS){ store.state.wedding.groups[g]=store.state.wedding.groups[g].filter(x=>x.id!==id);} save(); },
    addWeddingBudget(v){
      store.state.wedding.budgetLedger.push({id:store.uid("b"),time:v.time,cat:v.cat,amount:+v.amount||0,note:v.note||"",wedding:true}); save();
    },
    deleteWeddingBudget(id){ store.state.wedding.budgetLedger=store.state.wedding.budgetLedger.filter(x=>x.id!==id); save(); },
    updateWeddingBudget(id,v){ const b=store.state.wedding.budgetLedger.find(x=>x.id===id); if(b)Object.assign(b,{time:v.time,cat:v.cat,amount:+v.amount||0,note:v.note||""}); save(); },
    uploadFile(v){ store.state.wedding.files.unshift({id:store.uid("f"),name:v.name,time:App.TODAY,type:v.type||"file"}); save(); },
    deleteFile(id){ store.state.wedding.files=store.state.wedding.files.filter(x=>x.id!==id); save(); },
    // 备婚任务 -> 今日计划 (一键同步)
    syncWeddingToToday(id){
      let found=null,grp="";
      for(const g of App.WEDDING_GROUPS){ const t=(store.state.wedding.groups[g]||[]).find(x=>x.id===id); if(t){found=t;grp=g;break;} }
      if(!found)return;
      store.state.todayTasks.unshift({id:store.uid("t"),title:"【备婚】"+found.title,cat:"备婚",
        due:found.plan+" 18:00",status:"待办",note:grp,remind:true,doneAt:null});
      save();
    },

    // ---- 存钱计划 ----
    addSavingGoal(v){
      store.state.savings.push({id:store.uid("s"),name:v.name,target:+v.target||0,deadline:v.deadline,note:v.note||"",records:[]}); save();
    },
    updateSavingGoal(id,v){ const g=store.state.savings.find(x=>x.id===id); if(g)Object.assign(g,v); save(); },
    deleteSavingGoal(id){ store.state.savings=store.state.savings.filter(x=>x.id!==id); save(); },
    addSavingRecord(goalId,v){
      const g=store.state.savings.find(x=>x.id===goalId); if(!g)return;
      g.records.push({id:store.uid("r"),time:v.time,amount:+v.amount||0,note:v.note||""}); save();
    },
    deleteSavingRecord(goalId,recId){ const g=store.state.savings.find(x=>x.id===goalId); if(g)g.records=g.records.filter(r=>r.id!==recId); save(); },
    // 测算工具
    calcSaving(target,deadline){
      const days=App.daysLeft(deadline); const months=Math.max(days/30,0.1); const weeks=Math.max(days/7,0.1);
      return { perMonth:Math.ceil(target/months), perWeek:Math.ceil(target/weeks), perDay:Math.ceil(target/days||target) ,days};
    },

    // ---- 智能记账 (含联动开关) ----
    addTransaction(v){
      const tx={id:store.uid("x"),type:v.type,cat:v.cat,amount:+v.amount||0,time:v.time,
        note:v.note||"",toSaving:v.toSaving||null,toWedding:!!v.toWedding};
      store.state.transactions.unshift(tx); save();
      this._applyTxLinks(tx,v);
      save();
    },
    _applyTxLinks(tx,v){
      if(tx.toSaving){
        const g=store.state.savings.find(x=>x.id===tx.toSaving);
        if(g) g.records.push({id:store.uid("r"),time:tx.time,amount:tx.amount,note:(v&&v.note)||"记账存入",src:tx.id});
      }
      if(tx.toWedding){
        const cat = App.WEDDING_BUDGET_CATS.includes(tx.cat)?tx.cat:"其他杂费";
        store.state.wedding.budgetLedger.push({id:store.uid("b"),time:tx.time,cat,note:tx.note||"记账同步",amount:tx.amount,wedding:true,src:tx.id});
      }
    },
    _rollbackTxLinks(tx){
      if(tx.toSaving){ const g=store.state.savings.find(x=>x.id===tx.toSaving);
        if(g){ let i=g.records.findIndex(r=>r.src===tx.id); if(i<0)i=g.records.findIndex(r=>r.time===tx.time&&r.amount===tx.amount); if(i>=0)g.records.splice(i,1); } }
      if(tx.toWedding){ let i=store.state.wedding.budgetLedger.findIndex(b=>b.src===tx.id); if(i<0)i=store.state.wedding.budgetLedger.findIndex(b=>b.time===tx.time&&b.amount===tx.amount&&b.wedding); if(i>=0)store.state.wedding.budgetLedger.splice(i,1); }
    },
    // 删除记账时，联动写入的存钱记录、备婚账单一并删除（按 src 精确匹配）
    _cascadeDeleteTxLinks(tx){
      if(tx.toSaving){ const g=store.state.savings.find(x=>x.id===tx.toSaving);
        if(g) g.records=g.records.filter(r=>r.src!==tx.id); }
      if(tx.toWedding){ store.state.wedding.budgetLedger=store.state.wedding.budgetLedger.filter(b=>b.src!==tx.id); }
    },
    deleteTransaction(id){
      const tx=store.state.transactions.find(x=>x.id===id);
      if(tx) this._cascadeDeleteTxLinks(tx);
      store.state.transactions=store.state.transactions.filter(x=>x.id!==id); save();
    },
    updateTransaction(id,v){
      const tx=store.state.transactions.find(x=>x.id===id); if(!tx)return;
      this._rollbackTxLinks(tx);
      Object.assign(tx,{type:v.type,cat:v.cat,amount:+v.amount||0,time:v.time,note:v.note||"",toSaving:v.toSaving||null,toWedding:!!v.toWedding});
      this._applyTxLinks(tx,v);
      save();
    },

    // ---- 饮食打卡 ----
    toggleMeal(meal){ const m=store.state.diet.today.meals[meal]; if(m){ if(!m.done){m.done=true;m.kcal=m.kcal||420;m.photo=m.photo||"🍽️";} else {m.done=false;m.kcal=0;} } save(); },
    addDietPhoto(meal){ const m=store.state.diet.today.meals[meal]; if(m){m.done=true;m.photo="📷";m.kcal=m.kcal||420;} save(); },
    setDietTarget(v){ store.state.diet.today.target=+v||0; save(); },
    deleteDietHistory(date){ store.state.diet.history=store.state.diet.history.filter(h=>h.date!==date); save(); },

    // ---- 心情日记 ----
    addMood(v){ store.state.moods.unshift({id:store.uid("m"),date:v.date,mood:v.mood,weather:v.weather,text:v.text}); save(); },
    updateMood(id,v){ const m=store.state.moods.find(x=>x.id===id); if(m)Object.assign(m,v); save(); },
    deleteMood(id){ store.state.moods=store.state.moods.filter(x=>x.id!==id); save(); },

    // ---- 每周复盘 ----
    addReview(v){ store.state.reviews.unshift({id:store.uid("rv"),week:v.week,done:[],undone:[],problem:"",plan:[],goal:[]}); save(); },
    updateReview(id,v){ const r=store.state.reviews.find(x=>x.id===id); if(r)Object.assign(r,v); save(); },

    // ---- 短视频复盘 ----
    addSvReview(v){
      store.state.svreviews.unshift({id:store.uid("sv"),platform:v.platform||"抖音",title:v.title,link:v.link||"",
        publishDate:v.publishDate||App.TODAY,play:+v.play||0,like:+v.like||0,comment:+v.comment||0,
        fav:+v.fav||0,share:+v.share||0,finish:+v.finish||0,tag:v.tag||"",note:v.note||""}); save();
    },
    updateSvReview(id,v){ const x=store.state.svreviews.find(z=>z.id===id); if(x)Object.assign(x,{
      platform:v.platform,title:v.title,link:v.link||"",publishDate:v.publishDate,play:+v.play||0,like:+v.like||0,
      comment:+v.comment||0,fav:+v.fav||0,share:+v.share||0,finish:+v.finish||0,tag:v.tag||"",note:v.note||""}); save(); },
    deleteSvReview(id){ store.state.svreviews=store.state.svreviews.filter(z=>z.id!==id); save(); },

    // ---- 素材图库 ----
    addMaterial(v){ store.state.materials.unshift({id:store.uid("mt"),name:v.name,cat:v.cat,type:v.type||"file",src:(v.src!=null?v.src:null),time:App.TODAY}); save(); },
    deleteMaterial(id){ store.state.materials=store.state.materials.filter(x=>x.id!==id); save(); },
    updateMaterial(id,v){ const m=store.state.materials.find(x=>x.id===id); if(m){ Object.keys(v).forEach(k=>{ if(v[k]!==undefined) m[k]=v[k]; }); save(); } },

    // ---- 设置 ----
    updateSettings(v){ Object.assign(store.state.settings,v); save(); },
  };
  App.M = M;
})();

</script>
<script>
/* =========================================================
   ui.js — 全局通用组件库
   按钮 / 标签 / 进度条 / 倒计时 / 统计卡片 / 表单弹窗 / Toast / 图表
   ========================================================= */
(function(){
  const App = (window.App = window.App || {});
  App.esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); };

  const STATUS_CLASS = {
    "待办":"todo","进行中":"doing","已完成":"done","逾期":"overdue","待整改":"fix",
    "正常":"normal","超支":"over","结余":"balance",
    "已达成":"reached","已过期":"expired",
  };
  const CAT_COLOR = {"工作":"#3b82f6","备婚":"#e8920c","装修":"#40916c","生活":"#7c5cff","自媒体":"#2f6fed"};

  const ui = {
    tag(text,cls){ const c=cls||STATUS_CLASS[text]||"todo"; return `<span class="tag ${c}">${App.esc(text)}</span>`; },
    catTag(cat){ const col=CAT_COLOR[cat]||"#40916c"; return `<span class="tag cat"><i class="cat-dot" style="background:${col}"></i>${App.esc(cat)}</span>`; },
    progress(pct){ pct=Math.max(0,Math.min(100,pct|0)); return `<div class="progress"><i style="width:${pct}%"></i></div>`; },
    progressRow(pct){ return `<div class="progress-row"><div class="progress thin" style="flex:1"><i style="width:${Math.max(0,Math.min(100,pct|0))}%"></i></div><span class="pct">${pct|0}%</span></div>`; },
    countdown(days){ days=Math.max(0,days); return `<div class="countdown"><div class="cd-box"><b>${days}</b><span>天</span></div></div>`; },
    statCard(o){
      const cls = (o.accent?"accent ":"") + (o.warn?"warn ":"");
      return `<div class="stat-card ${cls.trim()}">
        <div class="label"><span class="ico">${o.icon||"•"}</span>${App.esc(o.label)}</div>
        <div class="value">${o.value}${o.unit?`<small>${App.esc(o.unit)}</small>`:""}</div>
        ${o.sub?`<div class="sub">${App.esc(o.sub)}</div>`:""}
      </div>`;
    },
    btn(label,a,b){
      let variant="ghost", action="", icon="", sm=false, attr="";
      if(typeof a==="object"){ const o=a; variant=o.variant||"ghost"; action=o.action||""; icon=o.icon||""; sm=o.sm; attr=o.attr||""; }
      else { variant=a||"ghost"; action=b||""; }
      return `<button class="btn btn-${variant} ${sm?"btn-sm":""}" data-action="${action}" ${attr}>${icon?icon+" ":""}${App.esc(label)}</button>`;
    },

    // ---------- Toast ----------
    toast(msg,type){
      const root=document.getElementById("toastRoot"); if(!root)return;
      const el=document.createElement("div");
      el.className="toast "+(type||"");
      el.innerHTML=`${type==="err"?"⛔":type==="warn"?"⚠️":"✅"} <span>${App.esc(msg)}</span>`;
      root.appendChild(el);
      setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateX(40px)"; el.style.transition=".3s"; setTimeout(()=>el.remove(),300); },2200);
    },

    // ---------- 表单弹窗 ----------
    formModal(opts){
      const root=document.getElementById("modalRoot");
      const size=opts.size?(" "+opts.size):"";
      const fields=(opts.fields||[]).map(f=>{
        let ctrl="";
        const val=opts.value?opts.value[f.name]:"";
        const req=f.required?"req":"";
        if(f.type==="textarea"){
          ctrl=`<textarea name="${f.name}" placeholder="${App.esc(f.placeholder||"")}">${App.esc(val||"")}</textarea>`;
        }else if(f.type==="select"){
          const optsHtml=(f.options||[]).map(o=>{
            const v=typeof o==="object"?o.value:o; const l=typeof o==="object"?o.label:o;
            return `<option value="${App.esc(v)}" ${v===val?"selected":""}>${App.esc(l)}</option>`;
          }).join("");
          ctrl=`<select name="${f.name}">${optsHtml}</select>`;
        }else if(f.type==="switch"||f.type==="toggle"){
          const checked=(opts.value&&opts.value[f.name])||f.checked?"checked":"";
          ctrl=`<label class="switch"><input type="checkbox" name="${f.name}" ${checked}><span class="slider"></span></label>`;
        }else if(f.type==="file"){
          ctrl=`<input type="file" name="${f.name}" accept="${f.accept||"image/*"}">`;
        }else{
          const t=f.type==="number"?"number":f.type==="date"?"date":f.type==="time"?"time":f.type==="datetime"?"datetime-local":"text";
          ctrl=`<input type="${t}" name="${f.name}" value="${App.esc(val||"")}" placeholder="${App.esc(f.placeholder||"")}">`;
        }
        const labelTxt=f.label+(f.hint?`<span class="muted" style="font-weight:400">（${App.esc(f.hint)}）</span>`:"");
        return `<div class="grp" ${f.cond?`data-cond="${f.cond}"`:""}><label class="${req}">${labelTxt}</label>${ctrl}</div>`;
      }).join("");
      const html=`<div class="modal-mask" id="modalMask">
        <div class="modal${size}">
          <div class="modal-head"><h3>${App.esc(opts.title||"")}</h3><button class="x" data-close>×</button></div>
          <div class="modal-body"><form class="form" id="modalForm">${fields}</form></div>
          <div class="modal-foot">
            <button class="btn btn-ghost" data-close>取消</button>
            <button class="btn btn-primary" id="modalOk">${App.esc(opts.okText||"保存")}</button>
          </div>
        </div></div>`;
      root.innerHTML=html;
      const mask=document.getElementById("modalMask");
      mask.querySelectorAll('input[type=file]').forEach(inp=>{
        inp.addEventListener('change',()=>{
          const file=inp.files&&inp.files[0]; if(!file)return;
          const reader=new FileReader();
          reader.onload=()=>{
            const dataUrl=reader.result; const img=new Image();
            img.onload=()=>{
              let w=img.width,h=img.height; const max=1000;
              if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
              const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
              cv.getContext('2d').drawImage(img,0,0,w,h);
              try{ const out=cv.toDataURL('image/jpeg',0.72); mask._files=mask._files||{}; mask._files[inp.name]=out; }
              catch(err){ mask._files=mask._files||{}; mask._files[inp.name]=dataUrl; }
            };
            img.onerror=()=>{ mask._files=mask._files||{}; mask._files[inp.name]=dataUrl; };
            img.src=dataUrl;
          };
          reader.readAsDataURL(file);
        });
      });
      const close=()=>{ root.innerHTML=""; document.removeEventListener("keydown",onKey); };
      const onKey=(e)=>{ if(e.key==="Escape")close(); };
      document.addEventListener("keydown",onKey);
      mask.addEventListener("click",e=>{ if(e.target===mask||e.target.hasAttribute("data-close")) close(); });
      const collect=()=>{
        const fd=new FormData(document.getElementById("modalForm"));
        const out={};
        (opts.fields||[]).forEach(f=>{
          if(f.type==="switch"||f.type==="toggle") out[f.name]=fd.has(f.name);
          else if(f.type==="file"){
            const fv=(mask._files&&mask._files[f.name]!=null)?mask._files[f.name]:(opts.value&&opts.value[f.name]!=null?opts.value[f.name]:undefined);
            out[f.name]=fv;
          }
          else out[f.name]=fd.get(f.name);
        });
        return out;
      };
      document.getElementById("modalOk").addEventListener("click",()=>{
        const v=collect();
        if(opts.onSubmit) opts.onSubmit(v,close);
      });
      // 联动型：字段显隐（如勾选开关显示下级字段）
      if(opts.onChange) opts.onChange(document.getElementById("modalForm"),collect);
      return {close,collect};
    },

    // ---------- 素材预览弹窗 ----------
    mtPlaceholder(o){
      const icon={psd:"🎨",ai:"✒️",jpg:"🖼️",png:"🖼️",mp4:"🎬",pdf:"📄",file:"📦"}[o&&o.type]||"🖼️";
      const name=App.esc(o&&o.name||"素材"); const sub=App.esc(((o&&o.cat)||"")+" · "+((o&&o.type)||"").toUpperCase());
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%">
        <rect width="320" height="380" rx="18" fill="#1b4332"/>
        <rect x="18" y="18" width="284" height="284" rx="14" fill="#2d6a4f"/>
        <text x="160" y="180" font-size="92" text-anchor="middle">${icon}</text>
        <text x="160" y="338" font-size="18" fill="#d8f3dc" text-anchor="middle" font-family="sans-serif">${name}</text>
        <text x="160" y="362" font-size="13" fill="#95d5b2" text-anchor="middle" font-family="sans-serif">${sub}</text>
      </svg>`;
    },
    previewImage(opts){
      const root=document.getElementById("modalRoot");
      const imgOk=opts.src&&/^data:image|^https?:|^blob:/.test(opts.src);
      const body=imgOk?`<img class="prev-img" src="${opts.src}" alt="${App.esc(opts.title||"")}">`:`<div class="prev-ph">${this.mtPlaceholder(opts)}</div>`;
      root.innerHTML=`<div class="modal-mask" id="modalMask"><div class="modal md">
        <div class="modal-head"><h3>${App.esc(opts.title||"预览")}</h3><button class="x" data-close>×</button></div>
        <div class="modal-body" style="text-align:center">${body}</div>
      </div></div>`;
      const mask=document.getElementById("modalMask");
      const close=()=>{ root.innerHTML=""; document.removeEventListener("keydown",onKey); };
      const onKey=(e)=>{ if(e.key==="Escape")close(); };
      document.addEventListener("keydown",onKey);
      mask.addEventListener("click",e=>{ if(e.target===mask||e.target.hasAttribute("data-close")) close(); });
    },

    // ---------- 确认删除弹窗 ----------
    confirm(opts){
      const root=document.getElementById("modalRoot");
      const html=`<div class="modal-mask" id="modalMask"><div class="modal sm">
        <div class="modal-head"><h3>${App.esc(opts.title||"确认操作")}</h3><button class="x" data-close>×</button></div>
        <div class="modal-body"><p style="color:var(--text-2);line-height:1.7">${App.esc(opts.text||"确定要执行该操作吗？")}</p></div>
        <div class="modal-foot">
          <button class="btn btn-ghost" data-close>取消</button>
          <button class="btn btn-danger" id="cfmOk">${App.esc(opts.okText||"确认删除")}</button>
        </div></div></div>`;
      root.innerHTML=html;
      const mask=document.getElementById("modalMask");
      const close=()=>{ root.innerHTML=""; };
      mask.addEventListener("click",e=>{ if(e.target===mask||e.target.hasAttribute("data-close")) close(); });
      document.getElementById("cfmOk").addEventListener("click",()=>{ close(); opts.onOk&&opts.onOk(); });
    },

    // ---------- 图表 ----------
    pie(segments){
      // segments: [{label,value,color}]
      const total=segments.reduce((s,x)=>s+x.value,0)||1;
      let acc=0; const stops=segments.map(s=>{
        const start=acc/total*360; acc+=s.value; const end=acc/total*360;
        return `${s.color} ${start}deg ${end}deg`;
      }).join(",");
      const legend=segments.map(s=>`<div class="li"><i class="sw" style="background:${s.color}"></i>${App.esc(s.label)}<b style="margin-left:auto">${App.fmtMoney(s.value)}</b></div>`).join("");
      return `<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
        <div class="pie" style="background:conic-gradient(${stops})"><div class="hole"><div><div style="font-size:12px;color:var(--text-3)">合计</div><div style="font-weight:750;font-size:16px">${App.fmtMoney(total)}</div></div></div></div>
        <div class="legend">${legend}</div></div>`;
    },
    lineChart(points,color){
      // points: number[] 月度趋势
      const w=520,h=180,max=Math.max(...points,1),min=Math.min(...points,0);
      const step=w/(points.length-1||1);
      const coords=points.map((p,i)=>[i*step, h-(p-min)/(max-min||1)*(h-20)-10]);
      const path=coords.map((c,i)=>(i?"L":"M")+c[0].toFixed(1)+" "+c[1].toFixed(1)).join(" ");
      const area=path+` L ${w} ${h} L 0 ${h} Z`;
      const dots=coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="${color}"/>`).join("");
      return `<svg class="linechart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
        <path d="${area}" fill="url(#lg)"/>
        <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
        ${dots}</svg>`;
    },
  };
  App.ui = ui;
})();

</script>

  /* ---------------- 7. 智能记账 ---------------- */
  function p_ledger(el){
    const s=S(), c=C(), lm=c.ledgerMonth();
    const expMap={}; s.transactions.filter(x=>x.type==="expense").forEach(x=>{ expMap[x.cat]=(expMap[x.cat]||0)+x.amount; });
    const seg=Object.keys(expMap).map((k,i)=>({label:k,value:expMap[k],color:PALETTE[i%PALETTE.length]}));
    // 月度趋势（近6个月支出）
    const months=[]; for(let i=5;i>=0;i--){ const d=new Date(2026,6-i,1); months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
    const mm={}; s.transactions.filter(x=>x.type==="expense").forEach(x=>{ const m=x.time.slice(0,7); mm[m]=(mm[m]||0)+x.amount; });
    const series=months.map(m=>mm[m]||0);
    const rows=s.transactions.map(t=>`<div class="row" data-search="${App.esc(t.cat+t.note)}">
      <div class="main"><div class="title">${App.esc(t.cat)} ${t.toWedding?ui().catTag("备婚"):""} ${t.toSaving?ui().catTag("储蓄"):""}</div>
      <div class="meta"><span>📅 ${App.esc(t.time)}</span><span>${App.esc(t.note)}</span></div></div>
      <span class="amount ${t.type==="income"?"in":"out"}">${t.type==="income"?"+":"-"}${App.fmtMoney(t.amount)}</span>
      <button class="link" data-action="x-edit" data-id="${t.id}">编辑</button><button class="link danger" data-action="x-del" data-id="${t.id}">删除</button></div>`).join("");

    el.innerHTML=`

        <div class="head-actions">${ui().btn("＋ 记一笔","primary","x-add")}</div></div>
      <div class="stat-grid">
        ${ui().statCard({label:"本月收入",icon:"📥",value:App.fmtMoney(lm.income),accent:true})}
        ${ui().statCard({label:"本月支出",icon:"📤",value:App.fmtMoney(lm.expense),warn:lm.expense>lm.income})}
        ${ui().statCard({label:"本月结余",icon:"⚖️",value:App.fmtMoney(lm.balance),sub:lm.balance>=0?"盈余":"超支"})}
      </div>
      <div class="grid-2">
        <div class="card"><div class="card-head"><h3>支出构成（饼图）</h3></div><div class="card-body">${seg.length?ui().pie(seg):empty("暂无支出")}</div></div>
        <div class="card"><div class="card-head"><h3>月度支出趋势</h3></div><div class="card-body">${ui().lineChart(series,"#2d6a4f")}
          <div class="meta" style="margin-top:8px;color:var(--text-3);font-size:12px">${months.join(" · ")}</div></div></div>
      </div>
      <div class="section-title"><span class="bar"></span>收支明细</div>
      <div class="card"><div class="card-body" style="padding-top:4px"><div class="list">${rows}</div></div></div>`;

    App.bindActions(el,{
      "x-add":()=>ui().formModal({title:"记一笔",fields:[
        {name:"type",label:"收支类型",type:"select",options:["expense","income"],hint:"支出/收入"},
        {name:"cat",label:"分类",type:"select",options:["工资","兼职","理财","餐饮","交通","购物","居住","娱乐","医疗","其他杂费","服饰首饰支出","物料采购支出","其他"]},
        {name:"amount",label:"金额",type:"number",required:true},
        {name:"time",label:"时间",type:"date",required:true},
        {name:"note",label:"备注",type:"text"},
        {name:"toWedding",label:"是否计入备婚支出",type:"switch"},
        {name:"wedCat",label:"备婚分类",type:"select",options:App.WEDDING_BUDGET_CATS,cond:"wed"},
        {name:"toSaving",label:"是否计入储蓄存款",type:"switch"},
        {name:"savingId",label:"选择存钱目标",type:"select",options:s.savings.map(g=>({value:g.id,label:g.name})),cond:"sav"},
      ],onChange:form=>{
        const sync=()=>{ const wed=form.querySelector('[name=toWedding]').checked, sav=form.querySelector('[name=toSaving]').checked;
          form.querySelector('[data-cond=wed]').style.display=wed?"":"none";
          form.querySelector('[data-cond=sav]').style.display=sav?"":"none"; };
        form.querySelectorAll('input[type=checkbox]').forEach(ch=>ch.addEventListener("change",sync)); sync();
      },onSubmit:v=>{ if(v.type==="income"){ v.toWedding=false; } const send={type:v.type,cat:v.cat,amount:v.amount,time:v.time,note:v.note,toWedding:v.toWedding,toSaving:v.toSaving?(v.savingId||null):null};
        M().addTransaction(send); App.refresh();
        let msg="已记账"; if(send.toWedding)msg+=" · 已同步备婚预算"; if(send.toSaving)msg+=" · 已存入储蓄目标"; ui().toast(msg); }}),
      "x-edit":e=>{ const t=s.transactions.find(x=>x.id===e.currentTarget.dataset.id); ui().formModal({title:"编辑记账",value:Object.assign({},t,{savingId:t.toSaving||""}),fields:[
        {name:"type",label:"收支类型",type:"select",options:["expense","income"],hint:"支出/收入"},

      "diet-target":()=>ui().formModal({title:"设置每日目标热量",value:{target:t.target},fields:[
        {name:"target",label:"目标热量 (kcal)",type:"number",required:true}],

          <div class="k">存储占用<b>${App.dataUsage()}</b></div>
        </div>
        <p class="muted" style="font-size:12.5px;line-height:1.7;margin:0 0 12px"><b>跨设备同步推荐用法：</b>在下方「GitHub 云同步」填写 Token 和仓库名，开启自动同步开关。之后<b>每台设备</b>打开页面自动拉取最新数据，修改后自动推送到 GitHub，所有设备共享同一份数据。<br>也可手动导出/导入 JSON 做离线备份。若显示「临时模式」，多为手机以 file:// 打开导致本地存储受限，建议部署到 HTTPS 域名访问。</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          ${ui().btn("⬇ 导出数据","primary","set-export")}
          ${ui().btn("⬆ 导入数据（换设备恢复）","primary","set-import")}
          ${ui().btn("♻ 恢复演示数据","ghost","set-reset")}
          <input type="file" id="setImportFile" accept="application/json,.json" style="display:none">
        </div>
        <div class="gh-box" style="margin-top:14px;border-top:1px dashed var(--line);padding-top:12px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <b>☁ GitHub 云同步</b>
          </div>
          <p class="muted" style="font-size:12.5px;line-height:1.7;margin:0 0 10px">数据自动保存到 GitHub 仓库，<b>所有设备共享同一份数据</b>。需先在 GitHub 创建仓库并生成 Token（需 repo 权限），然后填写下方配置。</p>
          <div class="form" style="margin-bottom:10px">
            <div class="grp"><label>GitHub Token</label><input id="ghToken" type="password" value="${App.esc(st.githubToken)}" placeholder="ghp_xxxxxxxx"></div>
            <div class="grp"><label>仓库名（owner/repo）</label><input id="ghRepo" value="${App.esc(st.ghRepo)}" placeholder="如 dh1326060190-lgtm/huiye-workbench"></div>
            <div class="grp"><label>分支</label><input id="ghBranch" value="${App.esc(st.ghBranch||'master')}" placeholder="master"></div>
            <div class="grp"><label>文件路径</label><input id="ghPath" value="${App.esc(st.ghPath||'workbench-data.json')}" placeholder="workbench-data.json"></div>
            <button class="btn btn-primary" data-action="gh-save">保存 GitHub 配置</button>
          </div>
          ${toggle("☁ 开启自动云同步","cloudSync",!!st.cloudSync)}
          ${st.cloudSync?'<p class="muted" style="font-size:12px;margin:6px 0 8px">开启后：本设备每次改动自动推送到 GitHub；打开页面时自动拉取最新数据。Token 仅保存在本设备，不会被同步到云端。</p>':''}
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            ${st.cloudSync?ui().btn("⬇ 立即从 GitHub 拉取","ghost","cloud-pull"):''}
            ${st.cloudSync?ui().btn("☁ 立即推送到 GitHub","ghost","cloud-push"):''}
          </div>
        </div>
      </div></div>`;
    const fi = document.getElementById("setImportFile");
    if(fi) fi.addEventListener("change", ev=>{
      const f = ev.target.files && ev.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{ try{ App.store.importData(r.result); ui().toast("✅ 数据已导入并覆盖当前数据"); }catch(e){ ui().toast("导入失败："+e.message, "warn"); } };
      r.onerror = ()=> ui().toast("读取文件失败", "warn");
      r.readAsText(f);
      ev.target.value = "";
    });
    const ghHdr = null;
    // GitHub 云端操作
    async function cloudPull(){
      ui().toast("正在从 GitHub 拉取…");
      const ok=await App.cloudSync.pull();
      if(!ok) ui().toast("GitHub 暂无数据或拉取失败","warn");
    }
    async function cloudPush(){
      ui().toast("正在推送到 GitHub…");
      await App.cloudSync.pushOnce();
    }
    function toggle(label,key,on){
      return `<div class="toggle-line"><span>${label}</span><label class="switch"><input type="checkbox" data-set="${key}" ${on?"checked":""}><span class="slider"></span></label></div>`;
    }
    el.querySelectorAll("[data-set]").forEach(c=>c.addEventListener("change",e=>{
      const k=e.target.dataset.set, val=e.target.checked;
      if(k==="cloudSync" && val){
        const s=S().settings;
        if(!s.githubToken || !s.ghRepo){
          ui().toast("请先填写 GitHub Token 和仓库名并保存配置，再开启同步","warn");
          e.target.checked=false;
          return;
        }
      }
      M().updateSettings({[k]:val});
        if(k==="cloudSync"){
          if(val){
            ui().toast("已开启 GitHub 云同步：改动自动推送，打开时自动拉取");
          }else{ ui().toast("已关闭云同步"); }
        }else{ ui().toast("设置已更新"); }
    }));
    App.bindActions(el,{
      "set-save":()=>{ M().updateSettings({userName:el.querySelector("#setName").value,theme:el.querySelector("#setTheme").value}); App.refresh(); ui().toast("基础信息已保存"); },
      "gh-save":()=>{
        const token=el.querySelector("#ghToken").value.trim();
        const repo=el.querySelector("#ghRepo").value.trim();
        const branch=el.querySelector("#ghBranch").value.trim()||"main";
        const path=el.querySelector("#ghPath").value.trim()||"workbench-data.json";
        if(repo && !repo.includes("/")){ ui().toast("仓库名格式应为 owner/repo","warn"); return; }
        M().updateSettings({githubToken:token, ghRepo:repo, ghBranch:branch, ghPath:path});
        App.refresh(); ui().toast("GitHub 配置已保存");
      },
      "set-export":()=>{ download("工作台数据备份.json",App.store.exportData()); ui().toast("数据已导出为 .json，请随身携带"); },
      "set-import":()=>{ const fi=document.getElementById("setImportFile"); if(fi) fi.click(); },
      "set-reset":()=>ui().confirm({text:"将清空当前数据并恢复为演示数据？",onOk:()=>{ App.store.reset(); App.refresh(); ui().toast("已恢复演示数据"); }}),
      "cloud-pull":()=>cloudPull(),
      "cloud-push":()=>cloudPush(),
    });
  }

  function empty(t){ return `<div class="empty"><span class="em">🗂</span>${App.esc(t)}</div>`; }
  function download(name,text){ const b=new Blob([text],{type:"text/plain;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

  /* ---------------- 11.5 短视频复盘 ---------------- */
  function p_svreview(el){
    const s=S(), arr=s.svreviews||[], ov=App.calc.svOverview();
    const rows=arr.map(v=>{
      const diag=App.calc.svDiagnose(v);
      const diagHtml=diag.map(d=>`<span class="sv-flag sv-${d.lv}">${d.lv==="good"?"✓":d.lv==="warn"?"!":"✕"} ${App.esc(d.t)}</span>`).join("");
      const linkHtml=v.link?`<a class="link" href="${App.esc(v.link)}" target="_blank" rel="noopener">打开链接 ↗</a>`:`<span class="muted">未填链接</span>`;
      return `<div class="card sv-card">
        <div class="card-head"><h3>${App.esc(v.platform)} · ${App.esc(v.title)}</h3>
          <div class="ops"><button class="link" data-action="sv-edit" data-id="${v.id}">编辑</button><button class="link danger" data-action="sv-del" data-id="${v.id}">删除</button></div></div>
        <div class="card-body">
          <div class="sv-meta">📅 ${App.esc(v.publishDate)} ｜ ${ui().catTag(v.tag||"未分类")} ｜ ${linkHtml}</div>
          <div class="sv-stats">
            ${svStat("播放",v.play)} ${svStat("点赞",v.like)} ${svStat("评论",v.comment)} ${svStat("收藏",v.fav)} ${svStat("转发",v.share)} ${svStat("完播",v.finish+"%")}
          </div>
          ${diagHtml?`<div class="sv-diag">${diagHtml}</div>`:""}
          ${v.note?`<div class="sv-note">📝 ${App.esc(v.note)}</div>`:""}
        </div></div>`;
    }).join("");
    el.innerHTML=`
      <div class="page-head"><div><h2>📊 短视频复盘</h2><p>多平台数据复盘 · 自动诊断健康度</p></div>
        <div class="head-actions">${ui().btn("＋ 新增发布记录","primary","sv-add")}</div></div>
      <div class="stat-grid">
        ${ui().statCard({label:"发布作品",icon:"🎬",value:ov.total,unit:"条"})}
        ${ui().statCard({label:"总播放",icon:"▶️",value:ov.totalPlay.toLocaleString(),unit:"次"})}
        ${ui().statCard({label:"平均完播率",icon:"⏱️",value:ov.avgFinish,unit:"%",accent:true})}
        ${ui().statCard({label:"平均互动率",icon:"💬",value:ov.avgEng,unit:"%"})}
      </div>
      ${ov.bestPlat!=="-"?`<div class="sv-best">🏆 表现最佳平台：<b>${App.esc(ov.bestPlat)}</b>（场均播放 ${ov.bestAvg.toLocaleString()}）${ov.top?` ｜ 爆款：<b>${App.esc(ov.top.title)}</b>（${ov.top.play.toLocaleString()} 播放）`:""}</div>`:""}
      <div class="card"><div class="card-head"><h3>发布记录（${arr.length}）</h3><span class="sub">填完数据自动给出专业诊断</span></div>
        <div class="card-body" style="padding-top:4px">${rows||empty("还没有发布记录，点右上角「＋ 新增发布记录」开始复盘")}</div></div>`;
    App.bindActions(el,{
      "sv-add":()=>svForm(null),
      "sv-edit":e=>{ const v=s.svreviews.find(x=>x.id===e.currentTarget.dataset.id); svForm(v); },
      "sv-del":e=>{ const id=e.currentTarget.dataset.id; ui().confirm({text:"删除该发布记录？",onOk:()=>{ M().deleteSvReview(id); App.refresh(); ui().toast("已删除"); }}); },
    });
  }
  function svStat(label,val){ return `<div class="sv-stat"><div class="v">${typeof val==="number"?val.toLocaleString():val}</div><div class="l">${label}</div></div>`; }
  function svForm(v){
    ui().formModal({title:v?"编辑发布记录":"新增发布记录",okText:v?"保存":"添加",value:v||{},fields:[
      {name:"platform",label:"发布平台",type:"select",options:["抖音","小红书","视频号","B站","快手","微博","其他"]},
      {name:"title",label:"视频标题",type:"text",required:true},
      {name:"link",label:"内容链接",type:"text",placeholder:"https://..."},
      {name:"publishDate",label:"发布时间",type:"date"},
      {name:"play",label:"播放量",type:"number"},
      {name:"like",label:"点赞",type:"number"},
      {name:"comment",label:"评论",type:"number"},
      {name:"fav",label:"收藏",type:"number"},
      {name:"share",label:"转发",type:"number"},
      {name:"finish",label:"完播率（%）",type:"number"},
      {name:"tag",label:"选题标签 / 赛道",type:"text",placeholder:"验房 / 备婚 / 本地生活"},
      {name:"note",label:"复盘笔记 / 我的建议",type:"textarea"},
    ],onSubmit:(f,close)=>{ if(v) M().updateSvReview(v.id,f); else M().addSvReview(f); close(); App.refresh(); ui().toast(v?"已保存":"已添加发布记录"); }});
  }

  App.pages={
    today:p_today, create:p_create, mp:p_mp, hot:p_hot, wedding:p_wedding,
    saving:p_saving, ledger:p_ledger, diet:p_diet, mood:p_mood, review:p_review,
    svreview:p_svreview, material:p_material, setting:p_setting,
  };
  App.empty=empty;
})();

</script>
<script>
/* =========================================================
   app.js — 导航渲染 / 路由 / 全局事件绑定 / 初始化
   ========================================================= */
(function(){
  const App = (window.App = window.App || {});
  const S = ()=>App.store.state;

  App.bindActions = function(el, map){
    el.querySelectorAll("[data-action]").forEach(node=>{
      const a = node.dataset.action;
      if(map[a] && !node._bound){ node._bound = true; node.addEventListener("click", e=>map[a](e)); }
    });
  };

  App.bindFilter = function(inputId, listId){
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);
    if(!input || !list) return;
    input.addEventListener("input", ()=>{
      const q = input.value.trim().toLowerCase();
      list.querySelectorAll(".row").forEach(r=>{
        const hit = (r.dataset.search||"").toLowerCase().includes(q);
        r.style.display = hit ? "" : "none";
      });
    });
  };

  function renderNav(){
    const nav = document.getElementById("nav");
    const cur = S().currentPage;
    const c = App.calc;
    const badges = {
      today: c.todayStats().overdue || 0,
      wedding: c.wedding().pending || 0,
    };
    nav.innerHTML = App.MENUS.map(m=>{
      const b = badges[m.id];
      return `<a class="nav-item ${m.id===cur?"active":""}" data-page="${m.id}">
        <span class="ico">${m.icon}</span><span>${m.name}</span>
        ${b?`<span class="badge">${b}</span>`:""}
      </a>`;
    }).join("");
    nav.querySelectorAll(".nav-item").forEach(n=>{
      n.addEventListener("click", ()=>{ App.store.state.currentPage = n.dataset.page; App.store.save(); renderNav(); App.refresh(); });
    });
  }

  function renderTopbar(){
    const m = App.MENUS.find(x=>x.id===S().currentPage);
    document.getElementById("topbar").innerHTML = `
      <div class="title"><h1>${m.name}</h1><span>${m.desc}</span></div>
      <div class="spacer"></div>
      <div class="global-search">🔍<input placeholder="全局搜索…"></div>`;
  }

  function renderBottombar(){
    const bar = document.getElementById("bottombar");
    if(!bar) return;
    const cur = S().currentPage;
    bar.innerHTML = App.MENUS.map(m=>`<a class="bb-item ${m.id===cur?"active":""}" data-page="${m.id}">
      <span class="ico">${m.icon}</span><span>${m.name}</span></a>`).join("");
    bar.querySelectorAll(".bb-item").forEach(n=>{
      n.addEventListener("click", ()=>{ App.store.state.currentPage=n.dataset.page; App.store.save(); App.refresh(); });
    });
  }

  App.refresh = function(){
    const el = document.getElementById("content");
    const key = S().currentPage;
    const page = App.pages[key] || App.pages.today;
    if(!page){ el.innerHTML='<p style="padding:20px">页面未找到: '+App.esc(key)+'</p>'; return; }
    page(el);
    renderNav();
    renderBottombar();
    renderTopbar();
  };

  function init(){
    try{
      renderNav();
      App.refresh();
      if(App._noPersist && App.ui && App.ui.toast){
        App.ui.toast("临时模式：本环境无法保存数据，请到「系统设置 → 数据导出」备份", 4200);
      }
      // 启动时自动从 GitHub 拉取最新数据
      if(App.cloudSync){
        setTimeout(()=>{
          if(App.cloudSync.enabled()) App.cloudSync.pull();
        }, 800);
        // 每 30 秒自动检查 GitHub 是否有新数据
        setInterval(()=>{
          if(App.cloudSync.enabled()) App.cloudSync.backgroundPull();
        }, 30000);
      }
    }catch(e){
      var show=function(msg){
        var d=document.createElement('div');
        d.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#fff;color:#b91c1c;padding:18px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px;line-height:1.6;';
        d.textContent=msg; document.body.appendChild(d);
      };
      show('init 异常:\n'+(e&&e.stack||e));
    }
  }
  document.addEventListener("DOMContentLoaded", init);
  // 若脚本在 DOMContentLoaded 之后才执行
  if(document.readyState!=="loading") init();
  // 页面关闭/切换前自动同步（在用户交互上下文中，浏览器不会剥离 Authorization 头）
  window.addEventListener("beforeunload", function(){
    if(App.cloudSync && App.cloudSync.enabled() && !App.cloudSync.suppress()) App.cloudSync.pushOnce();
  });
  // 页面隐藏时也尝试同步（手机端切换 App 时触发）
  window.addEventListener("pagehide", function(){
    if(App.cloudSync && App.cloudSync.enabled() && !App.cloudSync.suppress()) App.cloudSync.pushOnce();
  });
})();

</script>
<script>
(function(){
  var isMobile=/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var standalone=('standalone' in navigator && navigator.standalone)
    || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if(isMobile && !standalone){
    var h=document.getElementById('pwaHint'); if(h) h.style.display='flex';
  }
  var c=document.getElementById('pwaHintClose');
  if(c) c.onclick=function(){ var h=document.getElementById('pwaHint'); if(h) h.style.display='none'; };
})();
</script>
</body>
