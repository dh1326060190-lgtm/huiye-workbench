<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>从备份恢复 · 内销跟单工作台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Microsoft YaHei",sans-serif; background:linear-gradient(135deg,#1f2d3d,#0f1923); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .box { width:420px; background:#fff; border-radius:14px; padding:28px 26px; box-shadow:0 12px 40px rgba(0,0,0,.35); color:#222; }
    h2 { margin:0 0 6px; font-size:20px; }
    .sub { color:#888; font-size:13px; margin-bottom:18px; }
    .bak { border:1px solid #e1e8ed; border-radius:8px; padding:12px; margin-bottom:12px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
    .bak:hover { background:#f6f8fa; }
    .bak.sel { border-color:#2f6df6; background:#eef4ff; }
    .bak .meta b { display:block; font-size:14px; }
    .bak .meta span { color:#888; font-size:12px; }
    .bak .sz { color:#555; font-size:12px; }
    .bak.empty { opacity:.7; background:#fafafa; }
    .bak.empty .sz { color:#999; }
    #pwd { width:100%; padding:10px 12px; border:1px solid #d0d7de; border-radius:8px; font-size:14px; margin:12px 0; }
    #btn { width:100%; padding:11px; border:0; border-radius:8px; background:#2f6df6; color:#fff; font-size:15px; cursor:pointer; }
    #btn:disabled { background:#9aa6b5; cursor:not-allowed; }
    #msg { font-size:12px; min-height:18px; margin-top:10px; color:#555; }
    #msg.err { color:#d33; }
    #msg.ok { color:#2a9d4b; }
    .hint { color:#888; font-size:11px; margin-top:14px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h2>从本地备份恢复</h2>
    <div class="sub">选择一份备份，输入原访问密码后恢复</div>
    <div id="envState" style="display:none;margin-bottom:12px;padding:10px;border-radius:6px;background:#fff3f3;color:#a33;font-size:12px;border:1px solid #f5c6cb;"></div>
    <div id="list" style="max-height:260px;overflow:auto;">加载中…</div>
    <input id="pwd" type="password" placeholder="输入原访问密码（即备份时的密码）" />
    <button id="btn" disabled>请选择要恢复的备份</button>
    <div id="msg"></div>
    <div class="hint">恢复会覆盖当前浏览器里的全部工作台数据。恢复完成后页面会自动刷新，再用原密码解锁即可看到数据。</div>
  </div>

  <script src="store.js"></script>
  <script>
  (function(){
    var WB = window.WB;
    var store = WB.store;
    var listEl = document.getElementById('list');
    var btn = document.getElementById('btn');
    var pwd = document.getElementById('pwd');
    var msg = document.getElementById('msg');
    var selected = null;

    function setMsg(text, cls) { msg.textContent = text; msg.className = cls || ''; }

    // 检测当前环境是否为空/已重置
    var hasOrdersNow = localStorage.getItem('nxgd_orders') && localStorage.getItem('nxgd_orders').length > 100;
    var env = document.getElementById('envState');
    if (!hasOrdersNow) {
      env.style.display = 'block';
      env.textContent = '当前环境暂无订单数据，可能是重置了密码或首次使用。请从下方「推荐」备份恢复。';
    }

    fetch('/api/backups').then(function(r){ return r.json(); }).then(function(j){
      if (j.code !== 0 || !j.list || !j.list.length) {
        listEl.innerHTML = '<div style="color:#888;padding:12px;">服务器上暂无本地备份。</div>';
        return;
      }
      // 按大小降序，让含数据的备份排在最前，避免空备份被默认选中
      var list = j.list.slice().sort(function(a, b){ return b.size - a.size; });
      listEl.innerHTML = '';
      list.forEach(function(f, idx){
        var isEmpty = f.size < 1024;
        var div = document.createElement('div');
        div.className = 'bak' + (idx === 0 ? ' sel' : '') + (isEmpty ? ' empty' : '');
        div.innerHTML = '<div class="meta"><b>' + f.name + (idx === 0 && !isEmpty ? ' <span style="color:#2a9d4b;font-size:11px;border:1px solid #2a9d4b;padding:1px 5px;border-radius:4px;">推荐</span>' : '') + '</b><span>' + new Date(f.mtime).toLocaleString() + '</span></div><div class="sz">' + (f.size/1024).toFixed(1) + ' KB' + (isEmpty ? ' · 空备份' : '') + '</div>';
        div.onclick = function(){
          document.querySelectorAll('.bak').forEach(function(x){ x.classList.remove('sel'); });
          div.classList.add('sel');
          selected = f.name;
          btn.disabled = false;
          btn.textContent = '恢复选中的备份';
        };
        listEl.appendChild(div);
      });
      selected = list[0].name;
      btn.disabled = false;
      btn.textContent = '恢复选中的备份';
    }).catch(function(e){ listEl.innerHTML = '<div style="color:#d33;padding:12px;">加载备份列表失败：' + e.message + '</div>'; });

    btn.onclick = function(){
      if (!selected) { setMsg('请先选择一份备份', 'err'); return; }
      if (!pwd.value) { setMsg('请输入原访问密码', 'err'); return; }
      setMsg('正在读取备份…');
      btn.disabled = true;
      fetch('/api/backup?file=' + encodeURIComponent(selected)).then(function(r){
        if (!r.ok) throw new Error('备份不存在');
        return r.json();
      }).then(function(bundle){
        setMsg('正在写入数据…');
        return store.importAll(bundle);
      }).then(function(){
        setMsg('写入完成，正在校验密码…');
        return store.crypto.unlock(pwd.value);
      }).then(function(ok){
        if (!ok) throw new Error('密码错误，恢复后的备份无法解锁。请确认输入的是备份创建时的密码。');
        setMsg('恢复成功！页面将在 1 秒后刷新。', 'ok');
        setTimeout(function(){ location.href = './'; }, 1000);
      }).catch(function(e){
        setMsg('恢复失败：' + e.message, 'err');
        btn.disabled = false;
      });
    };
  })();
  </script>
</body>
</html>
